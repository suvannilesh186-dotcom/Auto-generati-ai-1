<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Settings</title>
  <!-- Link to External CSS -->
  <link rel="stylesheet" href="./master-settings.css">
</head>
<body>

  <!-- Master Setting Container -->
  <div class="settings-container">
    
    <!-- Short Video Toggle -->
    <div class="setting-item">
      <div>
        <div class="item-title">⚡ Short Video</div>
        <div class="item-desc">Enable Shorts Mode</div>
      </div>
      <button type="button" class="toggle-btn" id="shortVideoBtn" onclick="toggleShortMode()">
        <span class="toggle-knob"></span>
      </button>
    </div>

    <!-- Long Video Toggle -->
    <div class="setting-item">
      <div>
        <div class="item-title">🎥 Long Video</div>
        <div class="item-desc" id="longVideoLabel">Auto-Story Generator on Schedule</div>
      </div>
      <button type="button" class="toggle-btn" id="longVideoBtn" onclick="toggleLongMode()">
        <span class="toggle-knob"></span>
      </button>
    </div>

  </div>

  <!-- Timing Setup Mini Modal -->
  <div id="timingSetupModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h4 class="modal-title">⏰ Schedule Setup</h4>
        <button type="button" class="close-btn" onclick="cancelTimingSetup()">✕</button>
      </div>

      <label class="input-label">Set Trigger Time:</label>
      <input type="time" id="scheduledTime" class="time-input">

      <div class="btn-row">
        <button type="button" class="btn btn-cancel" onclick="cancelTimingSetup()">Cancel</button>
        <button type="button" class="btn btn-confirm" onclick="saveTimingSetup()">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Link to External JavaScript -->
  <script src="./master-settings.js"></script>
</body>
</html>
