<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ GPU LAB - AGC.AI</title>
    <link rel="stylesheet" href="lab1.css" />
</head>
<body>
    <header class="lab1-topbar">
        <div class="lab1-brand-group">
            <button id="backToDashBtn" class="lab1-btn secondary" type="button">← Dashboard</button>
            <div class="lab1-title">⚡ GPU LAB</div>
        </div>
        <div class="lab1-status-pill">48h Session Sync</div>
    </header>

    <main class="lab1-main">
        <!-- 1. Character Reference Photos -->
        <section class="lab1-section" id="charRefSection">
            <div class="section-head">
                <h2>1. 🎭 Character Reference Studio</h2>
                <div class="section-actions">
                    <button id="goAllCharBtn" class="lab1-btn go small" type="button">⚡ GO All Refs</button>
                    <button id="addCharRowBtn" class="lab1-btn small" type="button">+ Add Character</button>
                </div>
            </div>
            <div id="charRefRowsContainer" class="rows-container"></div>
        </section>

        <!-- 2. Scene Photos -->
        <section class="lab1-section" id="scenePhotoSection">
            <div class="section-head">
                <h2>2. 🖼️ Scene Photo Studio</h2>
                <div class="section-actions">
                    <button id="goAllPhotoBtn" class="lab1-btn go small" type="button">⚡ GO All Photos</button>
                    <button id="addPhotoRowBtn" class="lab1-btn small" type="button">+ Add Scene Photo</button>
                </div>
            </div>
            <div id="scenePhotoRowsContainer" class="rows-container"></div>
        </section>

        <!-- 3. Scene Video Prompts & Renders -->
        <section class="lab1-section" id="sceneVideoSection">
            <div class="section-head">
                <h2>3. 🎬 Scene Video Studio</h2>
                <div class="section-actions">
                    <button id="goAllVideoBtn" class="lab1-btn go small" type="button">⚡ GO All Videos</button>
                    <button id="addSceneRowBtn" class="lab1-btn small" type="button">+ Add Scene Step</button>
                </div>
            </div>
            <div id="sceneVideoRowsContainer" class="rows-container"></div>
        </section>
    </main>

    <!-- Press-and-Hold Image Zoom Modal -->
    <div id="zoomModalOverlay" class="zoom-modal-overlay" style="display:none;">
        <div class="zoom-modal-card">
            <button id="closeZoomModalBtn" class="zoom-close-btn" type="button">✕</button>
            <img id="zoomModalImage" class="zoom-modal-img" src="" alt="Zoomed Preview" />
        </div>
    </div>

    <script type="module" src="lab1.js"></script>
</body>
</html>
